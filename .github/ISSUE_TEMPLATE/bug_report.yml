name: Bug report / 問題回報
description: Report reproducible behavior without camera credentials or private images.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        English / 繁體中文皆可。Do not post RTSP passwords, tokens or private scenes.
        Security issues: read SECURITY.md first. 替身測試與真模型問題請分開說明。
  - type: dropdown
    id: mode
    attributes:
      label: Mode / 模式
      options: [Image, RTSP, Synthetic demo, Installation, Other]
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Engine / 模型
      options: [yolo26, da2-small, da3-small, da3-metric, Not applicable]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and expected / actual result / 步驟與預期、實際結果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 環境
      description: OS, Python, browser, torch, GPU/driver, package versions, actual input shape. No private paths.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted diagnostics / 已遮蔽的診斷
      description: State whether a real model was loaded. Explain units and remove secrets.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy / 隱私
      options:
        - label: I removed credentials and have permission to share all attached data. / 已移除帳密並取得資料分享權利。
          required: true

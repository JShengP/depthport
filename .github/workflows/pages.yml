name: Pages - multi-version static showcase
on:
  workflow_dispatch:
  # Publish reviewed website changes from main. PRs only build, never deploy.
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "website/**"
      - "tools/build_site.py"
      - "tests/test_pages_showcase.py"
      - "tests/test_recorded_examples.py"
      - "static/**"
      - "docs/assets/preview.en.png"
      - "docs/assets/spatial-preview.en.png"
      - "docs/assets/tracking-replay-start.zh-TW.jpg"
      - "docs/assets/tracking-replay-crossing.zh-TW.jpg"
      - "docs/assets/tracking-replay-later.zh-TW.jpg"
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "website/**"
      - "tools/build_site.py"
      - "tests/test_pages_showcase.py"
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Verify recorded examples and build static multi-version Pages
        run: |
          python tools/check_release.py
          python tools/build_site.py
          node --check website/showcase.js
          node --check website/recorded-examples.js
      - name: Verify generated routes and static-only boundary
        run: |
          python -m pip install "pytest>=8,<10"
          python -m pytest -q tests/test_pages_showcase.py tests/test_recorded_examples.py
      # Read existing public Pages metadata in PRs; enablement and deployment stay separate.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment

name: Bootstrap DepthPort v0.2 spatial analysis (one-time)
on:
  push:
    branches: ["feature/spatial-analysis-v0.2"]
    paths: [".depthport-v0.2.patch.base64", ".github/workflows/depthport-v0.2-bootstrap.yml"]
permissions:
  contents: write
jobs:
  apply-reviewed-diff:
    if: github.repository == 'JShengP/depthport' && github.ref == 'refs/heads/feature/spatial-analysis-v0.2'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify pinned source and apply reviewed source-only patch
        shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,lzma,subprocess
          from pathlib import Path
          base = 'a8fce96e1f83886410d31832055e3a5af8381386'
          assert subprocess.check_output(['git','rev-parse','origin/main'],text=True).strip()==base, "Unexpected branch base; refusing patch"
          encoded=Path('.depthport-v0.2.patch.base64').read_text(encoding='ascii').strip()
          content=base64.b64decode(encoded,validate=True)
          expected='2320073a7bf0299c06fde3199b3a1ffbbbb60bf4beaa86caeba2781683864992'
          assert hashlib.sha256(content).hexdigest()==expected, 'Wrong patch bytes'
          diff=lzma.decompress(content)
          for option in ('--check','--binary'):
              if option == '--binary':continue
              subprocess.run(['git','apply','--check','--binary','-'],input=diff,check=True)
          subprocess.run(['git','apply','--binary','-'],input=diff,check=True)
          PY
      - name: Install base test runtime (NO pretrained model weights)
        shell: bash
        run: |
          python -m pip install -r requirements-base.txt -r requirements-test.txt
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Validate Spatial Analysis API, geometry, translations and public manifest
        shell: bash
        run: |
          python -m pytest -q
          node --check static/spatial.js
          node --check static/main.js
          node --check static/viewer.js
          node tests/test_i18n.cjs
          node tests/test_spatial_i18n.cjs
          python tools/http_smoke.py
          git restore --source=HEAD -- .github/workflows/ci.yml
          git rm -f .depthport-v0.2.patch.base64 .github/workflows/depthport-v0.2-bootstrap.yml
          git add -A
          python tools/check_release.py
          # Restore this bootstrap workflow unchanged for a GITHUB_TOKEN push that has no workflows permission.
          # The connected maintainer removes the temporary workflow in a separate Git API commit after the push.
          git restore --source=HEAD --staged --worktree .github/workflows/depthport-v0.2-bootstrap.yml
      - name: Commit reviewed v0.2 source to feature branch only
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/feature/spatial-analysis-v0.2"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: DepthPort v0.2 Spatial Analysis alpha"
          git push origin HEAD:refs/heads/feature/spatial-analysis-v0.2

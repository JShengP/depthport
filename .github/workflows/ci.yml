name: Application contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / no pretrained weights
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    env:
      PYTHONUTF8: '1'
      MODEL_OFFLINE: '1'
      RTSP_URL: ''
      CAMERA_INTRINSICS_FILE: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install base and test dependencies
        run: python -m pip install -r requirements-base.txt -r requirements-test.txt
      - name: CPU tensors for adapter-contract tests (not model weights)
        run: python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Application and release tests
        run: python -m pytest -q --junitxml=artifacts/junit.xml
      - name: Source and public-file check
        run: python tools/check_release.py
      - name: Actual HTTP server without model inference
        run: python tools/http_smoke.py
      - name: JavaScript syntax and bilingual dictionary
        if: runner.os == 'Linux'
        run: |
          node --check static/i18n.js
          node --check static/main.js
          node --check static/viewer.js
          node tests/test_i18n.cjs
          bash -n RUN_UBUNTU.sh INSTALL_ALL_UBUNTU.sh
      - name: Upload test report (not a model benchmark)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: artifacts/junit.xml
          if-no-files-found: ignore
          retention-days: 14

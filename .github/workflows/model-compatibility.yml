name: Model API compatibility (no weights)
on:
  pull_request:
    paths:
      - 'requirements*.txt'
      - 'check_env.py'
      - 'depthport/**'
      - '.github/workflows/model-compatibility.yml'
  push:
    branches: [main]
    paths:
      - 'requirements*.txt'
      - 'check_env.py'
      - 'depthport/**'
      - '.github/workflows/model-compatibility.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: model-api-${{ github.ref }}
  cancel-in-progress: true
jobs:
  imports:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / model APIs without weights
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    env:
      PYTHONUTF8: '1'
      MODEL_OFFLINE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      DEPTH_DEVICE: cpu
      RTSP_URL: ''
      CAMERA_INTRINSICS_FILE: ''
      YOLO_CONFIG_DIR: ${{ runner.temp }}/ultralytics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install paired CPU runtime (not pretrained weights)
        run: python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install explicit model and test requirements
        run: python -m pip install -r requirements.txt -r requirements-v2.txt -r requirements-da3.txt -r requirements-test.txt
      - name: Check explicit runtime dependency consistency
        run: python -m pip check
      - name: Install reviewed DA3 source without optional CUDA or development dependencies
        run: python -m pip install --no-deps "depth-anything-3 @ https://github.com/ByteDance-Seed/Depth-Anything-3/archive/3d835ec.zip"
      - name: Check four real model API imports without inference
        run: python check_env.py --all
      - name: Test adapters with installed CPU runtime
        run: python -m pytest -q
      - name: Verify public source selection
        run: python tools/check_release.py

